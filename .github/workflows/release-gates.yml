name: Release gates
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  candidate:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project python/gisknife-engine --locked --extra dev
      - run: bash scripts/pack-candidate.sh
      - run: pnpm typecheck && pnpm test
      - run: uv run --project python/gisknife-engine --locked --extra dev pytest python/gisknife-engine/tests
      - name: Verify installed packages without online map data
        run: bash scripts/smoke-package.sh tmp/candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.os }}
          path: tmp/candidate
